# ══════════════════════════════════════════════════════════════════
#  J.A.R.V.I.S.  —  Just A Rather Very Intelligent System
#  Configuration.  Everything tunable lives here.
# ══════════════════════════════════════════════════════════════════

audio:
  input_device: null        # null = system default. Set to index or name substring.
  output_device: null
  sample_rate: 16000        # mic rate; wake word + whisper both want 16k
  block_size: 1280          # 80ms @ 16k — openWakeWord's native frame

wake:
  enabled: true
  model: hey_jarvis         # pretrained openWakeWord model
  # One model, both phrases. Measured on synthesized speech: "Hey Jarvis"
  # peaks at 0.997, bare "Jarvis" between 0.46 and 0.955 depending on voice,
  # while the confusable words (service, nervous, harvest) sit at 0.00-0.04.
  # 0.45 therefore catches both with a wide margin. Raise if it fires at the
  # television; lower if bare "Jarvis" is being missed.
  threshold: 0.45
  refractory_seconds: 2.0   # ignore re-triggers for this long after firing
  chime: true               # small ascending blip when he wakes

vad:
  threshold: 0.5            # silero speech probability
  min_speech_ms: 250        # ignore blips shorter than this
  silence_ms: 700           # this much quiet = you're done talking
  silence_ms_long: 750      # ...after 2.5s of speech, give a little more room
  max_utterance_s: 15       # hard stop
  patience_s: 6.0           # how long to wait for you to start speaking
  # A rolling buffer of audio from BEFORE the wake word fired. People say
  # "Hey Jarvis what time is it" in one breath, and the wake model needs most
  # of a second to fire -- by which point the command is already half spoken.
  # Without this, the start is simply lost.
  preroll_ms: 2000
  post_speech_guard_ms: 300  # settle + flush the mic after he stops speaking

conversation:
  # After he answers you can just keep talking -- no wake word. The window
  # resets on every turn and again when he finishes speaking, and is paused
  # while he speaks so a long answer never burns it.
  window_s: 15
  enabled: true

stt:
  model: small.en           # tiny.en | base.en | small.en | medium.en
  compute_type: int8        # int8 is the sweet spot on this CPU
  beam_size: 1              # 1 = greedy = fastest; 5 = slightly better
  cpu_threads: 6            # of 16; leaves headroom for TTS + LLM

llm:
  host: http://127.0.0.1:11434
  model: qwen2.5:7b-instruct     # primary — strong native tool calling
  fast_model: llama3.2:3b        # unused by default; swap in for snappier chat
  temperature: 0.6
  num_predict: 120               # spoken replies are short; caps runaway generation
  num_ctx: 4096                  # our prompt is ~1500 tok; smaller = less KV, faster
  keep_alive: 30m                # keep weights resident between turns
  max_tool_iterations: 6         # safety rail on the tool loop
  history_turns: 12              # conversational memory held in context
  fast_path_words: 8             # short, keyword-free chit-chat skips the tools
  max_tools: 10                  # tool schemas sent per turn (see tools/router.py)

# ── The voice ─────────────────────────────────────────────────────
# Kokoro gives a clean British read; the chain below is what makes it
# sound like the films. Tune by ear — every value is live-reloadable.
tts:
  voice: bm_daniel          # LOCKED. Chosen by ear; pinned in jarvis/voice/tts.py
  speed: 1.0                # LOCKED cadence
  sample_rate: 24000

voice_chain:
  enabled: false            # raw Kokoro beat every processed variant by ear

  pitch:
    semitones: -1.5         # weight and maturity
    formant_scale: 0.97     # shifts timbre independently of pitch

  eq:
    highpass_hz: 85         # clear the rumble
    low_mid:  { freq: 300,  gain_db: -2.5, q: 0.9 }   # de-box
    presence: { freq: 3000, gain_db: 3.0,  q: 0.8 }   # articulation
    air:      { freq: 9000, gain_db: 2.0,  q: 0.7 }   # synthetic sheen

  compressor:
    threshold_db: -20.0
    ratio: 3.0
    attack_ms: 8.0
    release_ms: 120.0
    makeup_db: 3.0

  doubler:
    enabled: true
    delay_ms: 15.0          # 12-18ms is the pocket
    detune_cents: 7.0
    mix: 0.18               # subtle — it should register, not announce itself

  room:
    enabled: true
    mix: 0.14               # this is what puts him in the workshop
    decay_s: 0.40
    predelay_ms: 12.0
    damping: 0.35

  limiter:
    ceiling_db: -1.0
    target_lufs_db: -16.0

memory:
  db_path: data/jarvis.db
  semantic: true            # false = keyword (FTS5) recall only, no model download
  embed_model: BAAI/bge-small-en-v1.5
  recall_limit: 5           # memories injected into context per turn

tools:
  confirm_destructive: true # shutdown / shell / delete need a spoken yes
  shell_enabled: true
  web_result_count: 5
  file_search_roots:
    - C:/Users/nicho/Documents
    - C:/Users/nicho/Desktop
    - C:/Users/nicho/Downloads

ui:
  width: 1100
  height: 720
  frameless: true
  fullscreen: true          # ALWAYS launches full screen. F11 toggles.
  minimize_on_sleep: true   # "that's all" minimises; the wake word restores
  always_on_top: false
  start_minimized: false
  hotkey: ctrl+alt+j        # trigger without the wake word

system:
  user_name: Nicholas
  address_as: sir
  log_level: INFO
